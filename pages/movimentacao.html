<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../style.css">
    <title>Movimentação</title>
</head>
<body>
    <aside class="sidebar">
        <a href="../index.html" class="logo">
            <img src="../images/logo.svg" alt="" width="40" height="40">
            <span>Dashboard<br>Financeiro</span>
        </a>

        <nav>
            <ul class="nav-bar">
                <li><a href="../index.html">Dashboard</a></li>
                <li><a href="movimentacao.html" class="ativo">Movimentação</a></li>
                <li><a href="meta.html">Meta Financeira</a></li>
            </ul>
        </nav>
    </aside>

    <div class="conteudo">
        <main>
            <h1>Movimentação</h1>

            <section class="barra-acoes">
                <button type="button" id="btn-nova">Nova Movimentação</button>
            </section>

            <section class="filtros">
                <div>
                    <label for="tipo">Tipo</label>
                    <select name="tipo" id="tipo">
                        <option value="" disabled selected>Selecione o tipo</option>
                        <option value="receita">Receita</option>
                        <option value="despesa">Despesa</option>
                    </select>
                </div>

                <div>
                    <label for="categoria">Categoria</label>
                    <select name="categoria" id="categoria">
                        <option value="" disabled selected>Selecione a categoria</option>
                        <option value="categoria 1">Categoria 1</option>
                        <option value="categoria 2">Categoria 2</option>
                        <option value="categoria 3">Categoria 3</option>
                    </select>
                </div>

                <div>
                    <label for="periodo">Período</label>
                    <select name="periodo" id="periodo">
                        <option value="" disabled selected>Selecione o período</option>
                    </select>
                </div>
            </section>

            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-movimentacoes"></tbody>
            </table>
        </main>

        <footer>
            <p>Dashboard Financeiro Pessoal</p>
        </footer>
    </div>

    <script src="../script.js"></script>
</body>
</html>
