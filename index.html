<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard financeiro</title>
</head>
<body>
    <aside class="sidebar">
        <a href="index.html" class="logo">
            <img src="images/logo.svg" alt="" width="40" height="40">
            <span>Dashboard<br>Financeiro</span>
        </a>

        <nav>
            <ul class="nav-bar">
                <li><a href="index.html" class="ativo">Dashboard</a></li>
                <li><a href="pages/movimentacao.html">Movimentação</a></li>
                <li><a href="pages/meta.html">Meta Financeira</a></li>
            </ul>
        </nav>
    </aside>

    <div class="conteudo">
        <main>
            <h1>Dashboard</h1>

            <section class="financeiro">
                <h2>Receitas</h2>
                <p id="ganhos"></p>
                <h2>Despesas</h2>
                <p id="perdas"></p>
                <h2>Saldo disponível</h2>
                <p id="saldo"></p>
            </section>

            <section class="grafico-dashboard">
                <article class="card-grafico">
                    <h2>Despesas por categoria</h2>
                    <div class="grafico-placeholder" role="img" aria-label="Gráfico de despesas por categoria"></div>
                    <ul class="legenda-grafico">
                        <li>Categoria 1</li>
                        <li>Categoria 2</li>
                        <li>Categoria 3</li>
                    </ul>
                </article>
            </section>

            <section>
                <h2>Meta financeira</h2>
                <p id="falta"></p>
                <progress value="50" max="100"></progress>
                <p id="porcentagem"></p>
            </section>

            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <tbody id="lista-movimentacoes"></tbody>
            </table>
        </main>

        <footer>
            <p>Dashboard Financeiro Pessoal</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
