<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/logo-icon.svg" type="image/logo-icon">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard financeiro</title>
</head>
<body>
    <aside class="sidebar">
        <a href="index.html" class="logo">
            <img src="images/logo.svg" alt="Insight Dash - Business Intelligence" width="208" height="52">
        </a>

        <nav>
            <ul class="nav-bar">
                <li><a href="index.html" class="ativo">Dashboard</a></li>
                <li><a href="pages/movimentacao.html">Movimentação</a></li>
                <li><a href="pages/meta.html">Meta Financeira</a></li>
            </ul>
        </nav>
    </aside>

    <div class="conteudo">
        <main>
            <h1>Dashboard</h1>

            <div class="resumo">
                <article class="card-resumo receita">
                    <h2>Receitas</h2>
                    <p id="ganhos"></p>
                </article>
                <article class="card-resumo despesa">
                    <h2>Despesas</h2>
                    <p id="perdas"></p>
                </article>
                <article class="card-resumo saldo">
                    <h2>Saldo disponível</h2>
                    <p id="saldo"></p>
                </article>
            </div>

            <div class="painel">
                <section class="card-grafico">
                    <h2>Despesas por categoria</h2>
                    <div id="grafico" class="grafico" role="img" aria-label="Gráfico de despesas por categoria"></div>
                    <ul id="legenda-grafico" class="legenda-grafico"></ul>
                </section>

                <section class="card-meta">
                    <h2>Meta financeira</h2>
                    <p id="falta"></p>
                    <progress id="progresso" value="0" max="100"></progress>
                    <p id="porcentagem"></p>
                </section>
            </div>

            <section class="card-tabela">
                <h2>Últimas movimentações</h2>
                <div class="tabela-rolagem">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th class="col-valor">Valor</th>
                            </tr>
                        </thead>
                        <tbody id="lista-movimentacoes"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer>
            <p>Dashboard Financeiro Pessoal</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
